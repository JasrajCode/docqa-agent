name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Tests
        # The tests start a pgvector container, which works because GitHub's Ubuntu runners ship Docker
        run: uv run pytest

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t docqa-agent .

      - name: Import the app inside the image
        # Catches missing modules or a broken entry point without needing credentials
        run: docker run --rm docqa-agent python -c "import docqa_agent.api"

  deploy:
    name: Deploy to Render
    needs: [checks, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}

    steps:
      - name: Trigger Render deploy hook
        # Skipped until the secret is set, so CI stays green before the service exists
        if: env.DEPLOY_HOOK != ''
        # -f: fail the job on an HTTP error response
        run: curl -fsS -X POST "$DEPLOY_HOOK"
